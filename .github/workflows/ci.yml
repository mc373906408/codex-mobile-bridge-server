name: Cloud Server

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go race, PostgreSQL and protocol vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: bridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U bridge -d bridge_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: 'true'
      CGO_ENABLED: '1'
      BRIDGE_TEST_DATABASE_URL: postgresql://bridge:ci-only-not-production@127.0.0.1:5432/bridge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Formatting, dependency verification and vet
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
          go mod verify
          go vet ./...
      - name: PostgreSQL integration and race tests (no skipped integration)
        run: |
          set -euo pipefail
          mkdir -p .tmp
          go test -race -count=1 -v ./... | tee .tmp/go-test.log
          if grep -q -- '--- SKIP:' .tmp/go-test.log; then echo 'CI must not skip database tests'; exit 1; fi
      - name: Administrator scoping, pagination, audit and code export UI regression
        run: |
          node --check internal/api/web/app.js
          node --check internal/api/web/campaigns.js
          node --test scripts/tests/*.test.cjs
      - name: Public protocol vectors and deployment helpers
        run: |
          python -m pip install -r scripts/requirements-protocol.txt
          python -B scripts/protocol_vectors.py --check
          python -B -m unittest discover -s scripts/tests -v

  containers:
    name: Isolated container migration and readiness smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: bridge-ci-${{ github.run_id }}-${{ github.run_attempt }}
      BRIDGE_DOMAIN: relay.example.test
      BRIDGE_ADMIN_LOGIN: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate ephemeral test secrets and validate Compose
        run: |
          python -B scripts/init_deployment.py --domain relay.example.test
          docker compose config --quiet
          docker compose run --no-deps --rm --entrypoint caddy https validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build and start only the isolated database and backend (no ACME or vendor push)
        run: |
          docker compose build server
          docker compose up -d --wait --wait-timeout 120 database server
          docker compose exec -T server /bridge-server healthcheck
          docker compose run --rm server migrate
          result="$(docker compose exec -T database sh -c 'PGPASSWORD="$(cat /run/secrets/database_password)" psql -h 127.0.0.1 -U bridge -d bridge -Atqc "SELECT rolsuper OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname=current_user"')"
          test "$result" = f
      - name: Remove only this ephemeral CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
