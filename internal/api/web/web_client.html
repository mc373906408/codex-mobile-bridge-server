<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>连接电脑 · Bridge</title>
  <link rel="icon" href="/_bridge/icon.png" type="image/png">
  <link rel="stylesheet" href="/_bridge/style.css">
  <script defer src="/_bridge/app.js"></script>
</head>
<body>
  <header class="page-header">
    <a class="wordmark" href="/" aria-label="Codex Mobile 首页"><img src="/_bridge/icon.png" width="32" height="32" alt=""><span>CODEX <span class="wordmark-sub">/ MOBILE</span></span></a>
    <span class="connection-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6 8.5 4.75 4.75 0 0 0 7 18Z"/></svg>云连接</span>
  </header>
  <main class="page">
    <div class="page-heading">
      <p class="eyebrow">继续电脑上的工作</p>
      <h1 id="page-title">连接你的电脑</h1>
      <p id="page-description" class="muted">使用与桌面客户端相同的云账号登录。</p>
    </div>
    <form id="login" class="login-form" hidden>
      <label for="account">云账号<input id="account" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="输入云账号" required></label>
      <label for="password">密码<input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required></label>
      <button class="primary" type="submit"><span>登录</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
    </form>
    <section id="computers" class="computers" aria-labelledby="computers-title" hidden>
      <div class="account-row"><span class="account-identity"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg><span id="identity"></span></span><button id="logout" class="text-button" type="button">退出登录</button></div>
      <div class="list-heading"><h2 id="computers-title">我的电脑 <span id="computer-count" class="count"></span></h2><button id="refresh" class="text-button refresh-button" type="button" aria-label="刷新电脑列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.2A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.8"/></svg><span>刷新</span></button></div>
      <p id="entitlement" class="notice"></p>
      <ul id="gateways" class="gateway-list"></ul>
      <div id="empty" class="empty-state" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><h3>还没有连接的电脑</h3><p>在电脑上打开桌面客户端，<br>登录同一云账号后，就会出现在这里。</p></div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">正在连接…</p>
    <noscript><p class="notice">请启用 JavaScript 后重新加载页面。</p></noscript>
  </main>
  <footer class="page-footer">任务在电脑运行 <span aria-hidden="true">·</span> 沿用桌面模型设置 <span aria-hidden="true">·</span> <a href="https://github.com/mc373906408/codex-mobile-bridge-server">AGPLv3 源码</a></footer>
  <template id="gateway-template">
    <li><a class="gateway-card"><span class="computer-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></span><span class="gateway-details"><strong class="gateway-name"></strong><span class="gateway-status"><i class="status-dot" aria-hidden="true"></i><span class="gateway-state"></span></span></span><span class="gateway-action"><span>连接</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></a></li>
  </template>
</body>
</html>
